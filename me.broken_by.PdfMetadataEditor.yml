app-id: me.broken_by.PdfMetadataEditor
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: pmedit-cli
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=home
modules:
  - name: pdf-metadata-editor-app
    buildsystem: simple
    build-commands:
      - mv -v app/* ${FLATPAK_DEST}
      - install -Dm644 src/modules/editor-gui/jpackage/pdf-metadata-edit.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/me.broken_by.PdfMetadataEditor.png
      - install -Dm644 src/flatpak/me.broken_by.PdfMetadataEditor-mime.xml ${FLATPAK_DEST}/share/mime/packages/me.broken_by.PdfMetadataEditor.xml
      - install -Dm644 src/flatpak/me.broken_by.PdfMetadataEditor.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 src/flatpak/me.broken_by.PdfMetadataEditor.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/zaro/pdf-metadata-editor/releases/download/v4.4.2/pdf-metadata-editor-4.4.2-amd64-linux-portable.tar.gz
        sha256: cce1b7ef48d1cf46c37a821b01b21845525463050fb6f2863b4cd61afbc26f8f
        dest: app
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/zaro/pdf-metadata-editor/releases/download/v4.4.2/pdf-metadata-editor-4.4.2-arm64-linux-portable.tar.gz
        sha256: 812ff7acbe2e67df555e7983b86ed84568f392fea1c9cc901c9a5c8b5847a9fa
        dest: app
        only-arches:
          - aarch64
      - type: archive
        url: https://github.com/zaro/pdf-metadata-editor/archive/refs/tags/v4.4.2.zip
        sha256: 65e3463f0bc416fd1a4451af1bae56e9626d22db05d26bd5f0148a4bc018eb9b
        dest: src
